<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山 5 天 4 夜行程清單</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --backup-card-bg: #f8f9fa;
      --text-color: #1c1c1e;
      --subtitle-color: #3a3a3c;
      --warning-color: #ff3b30;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #d1d1d6;
      z-index: 100;
      padding: 16px;
      text-align: center;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* 日期頁籤列表 */
    .tabs {
      display: flex;
      overflow-x: auto;
      background-color: #fff;
      padding: 12px;
      gap: 10px;
      border-bottom: 1px solid #e5e5ea;
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background-color: #e5e5ea;
      color: #3a3a3c;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* 主內容區 */
    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .day-content {
      display: none;
    }

    .day-content.active {
      display: block;
    }

    /* 行程卡片樣式 */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      margin-bottom: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e5e5ea;
    }

    .card.is-backup {
      background-color: var(--backup-card-bg);
      border: 1px dashed #8e8e93;
    }

    .card-header-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-tag {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background-color: #e5f1ff;
      color: var(--primary-color);
    }

    .status-tag {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background-color: #34c759;
      color: white;
    }

    .status-tag.backup {
      background-color: #8e8e93;
      color: white;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-hours, .card-info {
      font-size: 0.95rem;
      color: var(--subtitle-color);
      margin-top: 6px;
      line-height: 1.4;
    }

    .closed-day {
      color: var(--warning-color);
      font-weight: 700;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 10px 0;
      background-color: #e8f8ee;
      color: #1e7e34;
      border: 1px solid #b7e4c7;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>劉家釜山行程清單</h1>
  </header>

  <!-- 日期分頁標籤 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchDay('day1', event)">10/16 (五)</button>
    <button class="tab-btn" onclick="switchDay('day2', event)">10/17 (六)</button>
    <button class="tab-btn" onclick="switchDay('day3', event)">10/18 (日)</button>
    <button class="tab-btn" onclick="switchDay('day4', event)">10/19 (一)</button>
    <button class="tab-btn" onclick="switchDay('day5', event)">10/20 (二)</button>
  </div>

  <div class="container">
    <div id="day1" class="day-content active"></div>
    <div id="day2" class="day-content"></div>
    <div id="day3" class="day-content"></div>
    <div id="day4" class="day-content"></div>
    <div id="day5" class="day-content"></div>
  </div>

        { category: '行程', title: '大創 / Olive Young / ABC mart', mapUrl: 'https://maps.google.com/?q=Daiso+Busan', hours: '10:00 - 22:00', closed: '無', notes: '', isBackup: false },

        { category: '午餐', title: '1969 刀削麵', mapUrl: 'https://maps.google.com/?q=1969刀削麵+釜山', hours: '10:50 - 19:30', closed: '下午休息 15:00-17:00', notes: '', isBackup: false },
        { category: '行程', title: '新昌洞咖啡', mapUrl: 'https://maps.google.com/?q=新昌洞咖啡+釜山', hours: '10:00 - 21:00', closed: '無', notes: '', isBackup: false },
        { category: '行程', title: '富平罐頭市場：紅豆奶油艾草麻吉', mapUrl: 'https://maps.google.com/?q=Bupyeong+Kkangtong+Market+Milgot', hours: '08:00 - 20:00', closed: '無', notes: '', isBackup: false },
        { category: '行程', title: '海岸列車：尾浦站 -> 松亭站', mapUrl: 'https://maps.google.com/?q=Haeundae+Blueline+Park+-+Mipo+Station', hours: '09:30 - 19:00', closed: '全年無休', notes: '', isBackup: false },
        { category: '行程', title: '青沙埔：踏石觀景台與環海步道', mapUrl: 'https://maps.google.com/?q=Cheongsapo+Daritdol+Observatory', hours: '09:00 - 18:00', closed: '無', notes: '回程尾浦車站有小市集', isBackup: false },
        { category: '晚餐', title: '海雲台傳統市場', mapUrl: 'https://maps.google.com/?q=Haeundae+Traditional+Market', hours: '09:00 - 22:00', closed: '無', notes: '建議 19:00 前到比較不擁擠', isBackup: false },
        { category: '消夜', title: '請飯店代訂 Puradak 炸雞（黑蒜炸雞）', mapUrl: 'https://maps.google.com/?q=Puradak+Chicken+Busan', hours: '12:00 - 24:00', closed: '無', notes: '', isBackup: false }
      ],
      day4: [
        { category: '早餐', title: '大海鮑魚粥', mapUrl: 'https://maps.google.com/?q=大海鮑魚粥+釜山', hours: '08:00 - 20:00', closed: '每週三公休（今天營業）', notes: '', isBackup: false },

        { category: '晚餐', title: '【備選】水邊最高豬肉湯飯 海雲台店', mapUrl: 'https://maps.google.com/?q=水邊最高豬肉湯飯+海雲台', hours: '24 小時營業', closed: '無', notes: '湯飯備選', isBackup: true },

    function renderAll() {
      ['day1', 'day2', 'day3', 'day4', 'day5'].forEach(dayId => {
        const container = document.getElementById(dayId);
        container.innerHTML = '';
        if (tripData[dayId]) {
          tripData[dayId].forEach((item) => {
            const card = document.createElement('div');
            const isBackup = item.isBackup === true;
            card.className = `card ${isBackup ? 'is-backup' : ''}`;
            
            const mapLink = item.mapUrl || `https://maps.google.com/?q=${encodeURIComponent(item.title)}`;

            card.innerHTML = `
              <div class="card-header-tags">
                <span class="card-tag">${item.category || '行程'}</span>
                <span class="status-tag ${isBackup ? 'backup' : ''}">${isBackup ? '💡 備用' : '🌟 主要'}</span>
              </div>
              <div class="card-title">${item.title || '未命名項目'}</div>
              <div class="card-hours">⏰ <b>營業時間:</b> ${item.hours || '待定'}</div>
              <div class="card-hours">🚫 <b>公休日:</b> <span class="closed-day">${item.closed || '無'}</span></div>
              ${item.notes ? `<div class="card-info">📝 <b>備註:</b> ${item.notes}</div>` : ''}
              
              <a href="${mapLink}" target="_blank" class="btn-map">
                📍 開啟 Google Map 定位
              </a>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    function switchDay(dayId, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(dayId).classList.add('active');
    }

    renderAll();
  </script>
</body>
</html>
