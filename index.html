<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山 5 天 4 夜行程清單</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --backup-card-bg: #f8f9fa;
      --text-color: #1c1c1e;
      --subtitle-color: #3a3a3c;
      --warning-color: #ff3b30;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #d1d1d6;
      z-index: 100;
      padding: 16px;
      text-align: center;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* 日期頁籤列表 */
    .tabs {
      display: flex;
      overflow-x: auto;
      background-color: #fff;
      padding: 12px;
      gap: 10px;
      border-bottom: 1px solid #e5e5ea;
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background-color: #e5e5ea;
      color: #3a3a3c;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* 主內容區 */
    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .day-content {
      display: none;
    }

    .day-content.active {
      display: block;
    }

    /* 行程卡片樣式 */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      margin-bottom: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e5e5ea;
    }

    .card.is-backup {
      background-color: var(--backup-card-bg);
      border: 1px dashed #8e8e93;
    }

    .card-header-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-tag {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background-color: #e5f1ff;
      color: var(--primary-color);
    }

    .status-tag {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background-color: #34c759;
      color: white;
    }

    .status-tag.backup {
      background-color: #8e8e93;
      color: white;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-hours, .card-info {
      font-size: 0.95rem;
      color: var(--subtitle-color);
      margin-top: 6px;
      line-height: 1.4;
    }

    .closed-day {
      color: var(--warning-color);
      font-weight: 700;
    }

    /* 嵌入式地圖樣式 */
    .map-container {
      margin-top: 12px;
      width: 100%;
      height: 180px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #d1d1d6;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 10px;
      padding: 8px 0;
      background-color: #e8f8ee;
      color: #1e7e34;
      border: 1px solid #b7e4c7;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>釜山行程清單 (互動地圖版)</h1>
  </header>

  <!-- 日期分頁標籤 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchDay('day1', event)">10/16 (五)</button>
    <button class="tab-btn" onclick="switchDay('day2', event)">10/17 (六)</button>
    <button class="tab-btn" onclick="switchDay('day3', event)">10/18 (日)</button>
    <button class="tab-btn" onclick="switchDay('day4', event)">10/19 (一)</button>
    <button class="tab-btn" onclick="switchDay('day5', event)">10/20 (二)</button>
  </div>

  <div class="container">
    <div id="day1" class="day-content active"></div>
    <div id="day2" class="day-content"></div>
    <div id="day3" class="day-content"></div>
    <div id="day4" class="day-content"></div>
    <div id="day5" class="day-content"></div>
  </div>

  <script>
    // 這裡示範將特定景點加入 embedQuery (可用關鍵字或地名讓 Google 自動生成內嵌地圖)
    const tripData = {
      day1: [
        { category: '行程', title: '入住飯店：Pore Premium (大廳路 54-1)', query: 'Hotel Foret Premium Nampo Busan', mapUrl: 'https://maps.google.com/?q=Hotel+Foret+Premium+Nampo', hours: 'Check-in 15:00 後', closed: '無', notes: '釜山廣域市中區大廳路 54-1', isBackup: false },
        { category: '晚餐', title: '味贊王鹽烤肉 富平店', query: '味贊王鹽烤肉 富平店', mapUrl: 'https://maps.google.com/?q=味贊王鹽烤肉+富平店', hours: '11:30 - 23:00 (15:00-17:00休息)', closed: '全年無休', notes: '主要晚餐選項', isBackup: false }
      ],
      day2: [
        { category: '行程', title: '松島纜車（透明車廂）', query: 'Songdo Marine Cable Car', mapUrl: 'https://maps.google.com/?q=Songdo+Marine+Cable+Car', hours: '09:00 - 21:00', closed: '強風天可能停駛', notes: '', isBackup: false },
        { category: '晚餐', title: '83獬豸烤肉 (廣安店)', query: '83獬豸烤肉 廣安', mapUrl: 'https://share.google/m5R4rV5R2MVRoMclS', hours: '15:30 - 01:30', closed: '無', notes: '確認無人機表演有無取消', isBackup: false }
      ],
      day3: [
        { category: '行程', title: '富平罐頭市場：紅豆奶油艾草麻吉 (Milgot)', query: 'Bupyeong Kkangtong Market Busan', mapUrl: 'https://maps.app.goo.gl/tWp7hL8Y7H1S4', hours: '11:00 - 21:00', closed: '無', notes: '人氣排隊甜點', isBackup: false }
      ],
      day4: [
        { category: '行程', title: 'Skyline Luge 斜坡滑草車', query: 'Skyline Luge Busan', mapUrl: 'https://maps.google.com/?q=Skyline+Luge+Busan', hours: '10:00 - 18:00', closed: '無', notes: '記得帶棒球帽遮陽', isBackup: false }
      ],
      day5: [
        { category: '行程', title: 'Spa Land 汗蒸幕放鬆', query: 'Spa Land Centum City', mapUrl: 'https://maps.google.com/?q=Spa+Land+Centum+City', hours: '09:00 - 22:00', closed: '無', notes: '', isBackup: false }
      ]
    };

    function renderAll() {
      ['day1', 'day2', 'day3', 'day4', 'day5'].forEach(dayId => {
        const container = document.getElementById(dayId);
        container.innerHTML = '';
        if (tripData[dayId]) {
          tripData[dayId].forEach((item) => {
            const card = document.createElement('div');
            const isBackup = item.isBackup === true;
            card.className = `card ${isBackup ? 'is-backup' : ''}`;
            
            const mapLink = item.mapUrl || `https://maps.google.com/?q=${encodeURIComponent(item.title)}`;
            // 自動帶入 Google 嵌入地圖網址
            const searchQuery = encodeURIComponent(item.query || item.title);
            const embedMapUrl = `https://maps.google.com/maps?q=${searchQuery}&t=&z=15&ie=UTF8&iwloc=&output=embed`;

            card.innerHTML = `
              <div class="card-header-tags">
                <span class="card-tag">${item.category || '行程'}</span>
                <span class="status-tag ${isBackup ? 'backup' : ''}">${isBackup ? '💡 備用' : '🌟 主要'}</span>
              </div>
              <div class="card-title">${item.title || '未命名項目'}</div>
              <div class="card-hours">⏰ <b>營業時間:</b> ${item.hours || '待定'}</div>
              <div class="card-hours">🚫 <b>公休日:</b> <span class="closed-day">${item.closed || '無'}</span></div>
              ${item.notes ? `<div class="card-info">📝 <b>備註:</b> ${item.notes}</div>` : ''}
              
              <!-- 直接顯示互動式 Google 地圖 -->
              <div class="map-container">
                <iframe src="${embedMapUrl}" allowfullscreen="" loading="lazy"></iframe>
              </div>

              <a href="${mapLink}" target="_blank" class="btn-map">
                📍 在 Google Maps App 中開啟大地圖
              </a>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    function switchDay(dayId, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(dayId).classList.add('active');
    }

    renderAll();
  </script>
</body>
</html>
